name: Import verified private-rebuild tooling

on:
  push:
    branches: [main]
    paths: ['.source-import/**', '.github/workflows/import-source-tools.yml']

permissions:
  contents: write

concurrency:
  group: afml-source-tool-publication
  cancel-in-progress: false

jobs:
  import-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source-free payload before materializing
        run: python .source-import/import_tools.py
      - run: python -m pip install -r instructions/requirements-dev.txt
      - name: Run expanded public and synthetic source tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s instructions/tests -v
          python instructions/tools/audit_public_view.py
          python instructions/tools/verify_generated.py
      - name: Verify native scaffold with GCC and Clang sanitizers
        shell: bash
        run: |
          set -euo pipefail
          cmake -S system -B build/source-gcc -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
          cmake --build build/source-gcc --parallel 2
          ctest --test-dir build/source-gcc --output-on-failure
          cmake -S system -B build/source-clang -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DAFML_ENABLE_SANITIZERS=ON
          cmake --build build/source-clang --parallel 2
          ctest --test-dir build/source-clang --output-on-failure
      - name: Remove temporary transport and publish verified readable files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .source-import
          git rm .github/workflows/import-source-tools.yml
          git add --all
          python instructions/tools/audit_public_view.py --tracked-only
          git diff --cached --quiet && { echo 'Missing expected source-tool changes.'; exit 1; }
          git commit -m 'feat: publish private Word and source-rich Markdown rebuild tools with regression tests'
          git push origin HEAD:main
          echo "Published readable source tools: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic fixture tests and native tests ran before publication. Licensed-source integration was local; no visual, semantic, mathematical or trading approval is implied.' >> "$GITHUB_STEP_SUMMARY"
