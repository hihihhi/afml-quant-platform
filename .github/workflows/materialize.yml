name: Materialize checked public harness

on:
  push:
    branches: [main]
    paths: ['.publication/**', '.github/workflows/materialize.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: afml-publication
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Detect one-time transport
        id: transport
        shell: bash
        run: |
          set -euo pipefail
          if test -f .publication/READY; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No pending transport. No import or test result is claimed.'
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.transport.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Verify and materialize exact seed
        if: steps.transport.outputs.ready == 'true'
        run: python .publication/materialize.py
      - name: Install source-tool dependencies
        if: steps.transport.outputs.ready == 'true'
        run: python -m pip install -r instructions/requirements-dev.txt
      - name: Test public harness and exact regeneration
        if: steps.transport.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s instructions/tests -v
          python instructions/tools/audit_public_view.py
          python instructions/tools/verify_generated.py
      - name: Build and test GCC scaffold
        if: steps.transport.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S system -B build/import-gcc -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
          cmake --build build/import-gcc --parallel 2
          ctest --test-dir build/import-gcc --output-on-failure
      - name: Build and test Clang sanitizer scaffold
        if: steps.transport.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S system -B build/import-clang -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DAFML_ENABLE_SANITIZERS=ON
          cmake --build build/import-clang --parallel 2
          ctest --test-dir build/import-clang --output-on-failure
      - name: Commit verified files without rewriting history
        if: steps.transport.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          python instructions/tools/audit_public_view.py --tracked-only
          git diff --cached --quiet && { echo 'Expected publication changes are missing.'; exit 1; }
          git commit -m 'feat: materialize 1138 source-ordered AFML tasks and tested public harness'
          git push origin HEAD:main
          echo "Published commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo '18 Python checks and both native suites ran before this commit; no semantic, mathematical or trading readiness approval is implied.' >> "$GITHUB_STEP_SUMMARY"
