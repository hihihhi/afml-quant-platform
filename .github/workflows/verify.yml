name: Verify public harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afml-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require actual harness files
        run: |
          test -f instructions/tools/audit_public_view.py
          test -f instructions/02-book/task_index.json
          test -f instructions/tests/test_public_view.py
          test ! -f .publication/READY
      - run: python -m pip install -r instructions/requirements-dev.txt
      - run: python -m unittest discover -s instructions/tests -v
      - run: python instructions/tools/audit_public_view.py --tracked-only
      - run: python instructions/tools/verify_generated.py
      - name: Document verification boundary
        run: echo 'Public metadata, requirement locks, regression tests and deterministic regeneration only. The licensed book is absent; no private Word/pixel or independent semantic/mathematical approval is claimed.' >> "$GITHUB_STEP_SUMMARY"
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            sanitizers: 'OFF'
          - compiler: clang++
            sanitizers: 'ON'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require actual native project
        run: test -f system/CMakeLists.txt
      - run: cmake -S system -B build/native -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DAFML_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure
